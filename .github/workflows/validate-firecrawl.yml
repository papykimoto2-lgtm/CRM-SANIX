name: Validate Firecrawl Lead Hunter

on:
  pull_request:
    branches:
      - main
      - improvement/prospect-intelligence-v1
    paths:
      - "supabase/functions/**"
      - "supabase/deploy/**"
      - "supabase/build_functions.sh"
      - "tests/gmail_test.js"
      - "tests/wacrm_test.js"
      - ".github/workflows/validate-firecrawl.yml"
  push:
    branches:
      - main
      - feature/firecrawl-scrape-lead-hunter
      - fix/firecrawl-hunter-catalog
      - fix/firecrawl-hunter-page-cap
      - improvement/agent-dependency-preflight
      - improvement/unify-lead-hunter-preflight

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check Firecrawl module
        run: deno check supabase/functions/_shared/firecrawl.ts

      - name: Test Firecrawl URL validation
        run: deno test supabase/functions/_shared/firecrawl_test.ts

      - name: Test preflight du Lead Hunter V1
        run: deno test supabase/functions/_shared/company/dependency_preflight_test.ts

      - name: Tests d'intégration Gmail et WhatsApp CRM
        run: |
          node --experimental-strip-types tests/gmail_test.js
          node --experimental-strip-types tests/wacrm_test.js

      - name: Regenerate deployment bundles
        run: sh supabase/build_functions.sh

      - name: Verify Firecrawl is present in generated agent bundles
        run: |
          grep -q "firecrawl_scrape" supabase/deploy/ai-sales-director/index.ts
          grep -q "firecrawl_scrape" supabase/deploy/ai-company/index.ts

      - name: Commit generated deployment bundles to the working branch
        if: github.event_name == 'push'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/deploy
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate Supabase deployment bundles"
            branch="${PR_BRANCH:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${branch}"
          fi
