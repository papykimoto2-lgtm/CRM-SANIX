name: Build SANIX realistic human avatars
on:
  workflow_dispatch:
  push:
    branches: [main, feat/photorealistic-human-avatars]
    paths:
      - ".github/workflows/build-human-avatars.yml"
      - "company/assets/realistic/**"
      - "company/assets.js"
      - "company/avatar_glb.js"
permissions:
  contents: write
concurrency:
  group: sanix-realistic-avatars-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned CC0 human generator
        run: |
          git clone https://github.com/olatunde85/3d-gen.git /tmp/ara
          git -C /tmp/ara checkout c0abe46261171ad3ec570b39beabe386669cae4d
      - name: Install generator and CC0 MakeHuman assets
        working-directory: /tmp/ara
        run: |
          npm install
          npm run setup-assets
      - name: Generate four clothed African corporate humans
        working-directory: /tmp/ara
        run: |
          mkdir -p /tmp/sanix-avatars
          for name in homme_a homme_b femme_a femme_b; do
            npm run export -- --params "$GITHUB_WORKSPACE/company/assets/realistic/$name.json" --detail high --formats glb --out /tmp/sanix-avatars
            test -s "/tmp/sanix-avatars/$name.glb"
            test "$(stat -c%s "/tmp/sanix-avatars/$name.glb")" -gt 100000
            cp "/tmp/sanix-avatars/$name.glb" "$GITHUB_WORKSPACE/company/assets/characters/$name.glb"
          done
          ls -lh "$GITHUB_WORKSPACE"/company/assets/characters/*.glb
      - name: Validate GLB containers and rig metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          for name in ("homme_a","homme_b","femme_a","femme_b"):
              p=pathlib.Path("company/assets/characters")/(name+".glb")
              data=p.read_bytes()
              magic, version, length=struct.unpack_from("<III",data,0)
              assert magic==0x46546C67 and version==2 and length==len(data), name
              pos=12; doc=None
              while pos < len(data):
                  size, kind=struct.unpack_from("<II",data,pos); pos+=8
                  chunk=data[pos:pos+size]; pos+=size
                  if kind==0x4E4F534A: doc=json.loads(chunk.decode("utf-8")); break
              assert doc and doc.get("skins"), f"{name}: no rigged skin"
              assert doc.get("meshes"), f"{name}: no mesh"
              print(name, len(doc.get("meshes",[])), "meshes", len(doc.get("skins",[])), "skins", len(data)//1024, "KB")
          PY
      - name: Commit new realistic GLB models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company/assets/characters/homme_a.glb company/assets/characters/homme_b.glb company/assets/characters/femme_a.glb company/assets/characters/femme_b.glb
          git diff --cached --stat
          git commit -m "Replace procedural avatars with CC0 MakeHuman-derived corporate humans"
          git push origin HEAD:${{ github.ref_name }}
